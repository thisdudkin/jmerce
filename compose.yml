services:

  # Databases

  customer-postgres:
    image: postgres:18.4
    container_name: customer-postgres
    environment:
      POSTGRES_DB: customers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - customers-data:/var/lib/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d customers -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Microservices

  customer-service:
    image: jmerce-customer-service:0.0.1
    container_name: customer-service
    environment:
      SERVER_PORT: 8090
      THC_PATH: /actuator/health
      SPRING_DATASOURCE_URL: jdbc:postgresql://customer-postgres:5432/customers
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      customer-postgres:
        condition: service_healthy

  # Observability

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - loki-data:/loki
      - ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    ports:
      - "3200:3200"
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - tempo-data:/var/tempo
      - ./infrastructure/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    user: root
    ports:
      - "9080:9080" # HTTP interface
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP http
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      test: ["CMD", "/bin/alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      alloy:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_SECURITY_ADMIN_USER: root
      GF_SECURITY_ADMIN_PASSWORD: root
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./infrastructure/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  customers-data:
  tempo-data:
  loki-data:
