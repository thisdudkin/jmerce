services:
  customer-postgres:
    image: postgres:18.4
    container_name: customer-postgres
    environment:
      POSTGRES_DB: customers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - customers-data:/var/lib/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d customers -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  customers-data:
