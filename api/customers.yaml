openapi: 3.0.0

info:
  title: Customer Service API
  description: Public REST API for managing customer business profiles and addresses
  version: 0.0.1

servers:
  - url: 'http://localhost:8090'
    description: Local

  - url: 'https://api.jmerce.com'
    description: Production

tags:
  - name: Customers
    description: Customer business profile lifecycle

  - name: Addresses
    description: Shipping and billing addresses owned by a customer

paths:

  /customers:
    post:
      operationId: createCustomer
      tags:
        - Customers
      summary: Create a customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Customer profile created
          headers:
            Location:
              description: URI of the created customer profile
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'

  /customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Customer identifier
        schema:
          type: string
          format: uuid
        example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3

    get:
      operationId: getCustomer
      tags:
        - Customers
      summary: Get a customer profile
      responses:
        '200':
          description: Customer profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'

    put:
      operationId: updateCustomer
      tags:
        - Customers
      summary: Update editable customer profile data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Customer profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'

    delete:
      operationId: closeCustomer
      tags:
        - Customers
      summary: Close a customer profile
      responses:
        '204':
          description: Customer profile closed

  /customers/{customerId}/addresses:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Customer identifier
        schema:
          type: string
          format: uuid
        example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3

    get:
      operationId: listCustomerAddresses
      tags:
        - Addresses
      summary: List customer addresses
      responses:
        '200':
          description: Customer addresses returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'

    post:
      operationId: createCustomerAddress
      tags:
        - Addresses
      summary: Create a customer address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          description: Customer address created
          headers:
            Location:
              description: URI of the created customer address
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'

  /customers/{customerId}/addresses/{addressId}:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Customer identifier
        schema:
          type: string
          format: uuid
        example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3

      - name: addressId
        in: path
        required: true
        description: Address identifier
        schema:
          type: string
          format: uuid
        example: 01985dda-369b-79ca-b943-3e0353f206d8

    get:
      operationId: getCustomerAddress
      tags:
        - Addresses
      summary: Get a customer address
      responses:
        '200':
          description: Customer address found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'

    put:
      operationId: updateCustomerAddress
      tags:
        - Addresses
      summary: Update a customer address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateRequest'
      responses:
        '200':
          description: Customer address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'

    delete:
      operationId: deleteCustomerAddress
      tags:
        - Addresses
      summary: Delete a customer address
      responses:
        '204':
          description: Customer address deleted

  /customers/{customerId}/addresses/{addressId}/default:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Customer identifier
        schema:
          type: string
          format: uuid
        example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3

      - name: addressId
        in: path
        required: true
        description: Address identifier
        schema:
          type: string
          format: uuid
        example: 01985dda-369b-79ca-b943-3e0353f206d8

    put:
      operationId: makeCustomerAddressDefault
      tags:
        - Addresses
      summary: Set a customer address as the default
      responses:
        '200':
          description: Default address assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'

components:
  schemas:

    CustomerCreateRequest:
      type: object
      required:
        - userId
        - givenName
        - familyName
      properties:
        userId:
          type: string
          format: uuid
          example: 01985dd8-d6d7-758b-b778-3b20e2a618c9

        givenName:
          $ref: '#/components/schemas/GivenName'

        familyName:
          $ref: '#/components/schemas/FamilyName'

        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

    CustomerUpdateRequest:
      type: object
      required:
        - givenName
        - familyName
      properties:
        givenName:
          $ref: '#/components/schemas/GivenName'

        familyName:
          $ref: '#/components/schemas/FamilyName'

        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

    CustomerResponse:
      type: object
      required:
        - id
        - userId
        - givenName
        - familyName
        - phoneNumber
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3

        userId:
          type: string
          format: uuid
          readOnly: true
          example: 01985dd8-d6d7-758b-b778-3b20e2a618c9

        givenName:
          $ref: '#/components/schemas/GivenName'

        familyName:
          $ref: '#/components/schemas/FamilyName'

        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

        status:
          allOf:
            - $ref: '#/components/schemas/CustomerStatus'
          readOnly: true

        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-09T15:30:00Z'

        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-09T15:30:00Z'

    AddressCreateRequest:
      type: object
      required:
        - purpose
        - recipientName
        - line1
        - city
        - countryCode
      properties:
        purpose:
          $ref: '#/components/schemas/AddressPurpose'

        recipientName:
          type: string
          minLength: 1
          maxLength: 200
          example: Ivan Ivanov

        line1:
          type: string
          minLength: 1
          maxLength: 300
          example: 15 Strict Avenue

        line2:
          type: string
          nullable: true
          minLength: 1
          maxLength: 300
          example: Apartment 42

        city:
          type: string
          minLength: 1
          maxLength: 150
          example: Minsk

        region:
          type: string
          nullable: true
          minLength: 1
          maxLength: 150
          example: Minsk

        postalCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 32
          example: '220030'

        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          example: BY

        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

        isDefault:
          type: boolean
          default: false

    AddressUpdateRequest:
      type: object
      required:
        - purpose
        - recipientName
        - line1
        - city
        - countryCode
      properties:
        purpose:
          $ref: '#/components/schemas/AddressPurpose'

        recipientName:
          type: string
          minLength: 1
          maxLength: 200
          example: Ivan Ivanov

        line1:
          type: string
          minLength: 1
          maxLength: 300
          example: 15 Strict Avenue

        line2:
          type: string
          nullable: true
          minLength: 1
          maxLength: 300
          example: Apartment 42

        city:
          type: string
          minLength: 1
          maxLength: 150
          example: Minsk

        region:
          type: string
          nullable: true
          minLength: 1
          maxLength: 150
          example: Minsk

        postalCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 32
          example: '220030'

        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          example: BY

        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

    AddressResponse:
      type: object
      required:
        - id
        - customerId
        - purpose
        - recipientName
        - line1
        - line2
        - city
        - region
        - postalCode
        - countryCode
        - phoneNumber
        - isDefault
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 01985dda-369b-79ca-b943-3e0353f206d8

        customerId:
          type: string
          format: uuid
          readOnly: true
          example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3

        purpose:
          $ref: '#/components/schemas/AddressPurpose'

        recipientName:
          type: string
          minLength: 1
          maxLength: 200
          example: Ivan Ivanov

        line1:
          type: string
          minLength: 1
          maxLength: 300
          example: 15 Strict Avenue

        line2:
          type: string
          nullable: true
          minLength: 1
          maxLength: 300
          example: Apartment 42

        city:
          type: string
          minLength: 1
          maxLength: 150
          example: Minsk

        region:
          type: string
          nullable: true
          minLength: 1
          maxLength: 150
          example: Minsk

        postalCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 32
          example: '220030'

        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code in uppercase.
          example: BY

        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

        isDefault:
          type: boolean
          readOnly: true
          example: true

        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-09T15:35:00Z'

        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-09T15:35:00Z'

    GivenName:
      type: string
      minLength: 1
      maxLength: 100
      example: Ivan

    FamilyName:
      type: string
      minLength: 1
      maxLength: 100
      example: Ivanov

    NullablePhoneNumber:
      type: string
      nullable: true
      pattern: '^\+[1-9][0-9]{7,14}$'
      example: '+375291234567'

    CustomerStatus:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - CLOSED
      example: ACTIVE

    AddressPurpose:
      type: string
      enum:
        - SHIPPING
        - BILLING
      example: SHIPPING
