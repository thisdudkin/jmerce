openapi: 3.1.0

info:
  title: Shared HTTP Problem Responses
  description: Reusable RFC 9457 error responses for JMerce REST APIs.
  version: 0.1.0

paths: {}

components:
  responses:
    BadRequest:
      description: The request is malformed or violates input constraints.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            validationFailure:
              $ref: '#/components/examples/ValidationFailure'
    NotFound:
      description: The requested resource does not exist within the specified scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            resourceNotFound:
              $ref: '#/components/examples/ResourceNotFound'
    Conflict:
      description: The request conflicts with resource state or a uniqueness constraint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            stateConflict:
              $ref: '#/components/examples/StateConflict'
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            internalError:
              $ref: '#/components/examples/InternalError'

  schemas:
    ProblemDetail:
      title: ProblemDetail
      type: object
      description: |
        RFC 9457 Problem Details response. `code`, `traceId`, and `errors` are optional
        JMerce extensions exposed through Spring's `ProblemDetail` properties map.
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this specific occurrence.
        code:
          type: string
          description: Stable, machine-readable application error code.
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: CUSTOMER_NOT_FOUND
        traceId:
          type: string
          description: Distributed trace identifier used for diagnostics.
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: Field-level errors, present when request validation fails.
          items:
            $ref: '#/components/schemas/FieldError'
      additionalProperties: true

    FieldError:
      title: FieldError
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: JSON property or parameter that failed validation.
          example: phoneNumber
        message:
          type: string
          description: Human-readable validation message.
          example: must match E.164 format
        code:
          type: string
          description: Machine-readable validation rule identifier.
          example: Pattern

  examples:
    ValidationFailure:
      summary: Request validation failed
      value:
        type: https://api.jmerce.example/problems/validation-failed
        title: Request validation failed
        status: 400
        detail: One or more request fields are invalid.
        instance: /customers
        code: VALIDATION_FAILED
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - field: phoneNumber
            message: must match E.164 format
            code: Pattern
    ResourceNotFound:
      summary: Resource not found
      value:
        type: https://api.jmerce.example/problems/resource-not-found
        title: Resource not found
        status: 404
        detail: The requested customer does not exist.
        instance: /customers/01985dd9-6d7d-7c76-a91b-4a175c3dbfc3
        code: CUSTOMER_NOT_FOUND
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    StateConflict:
      summary: Resource state conflict
      value:
        type: https://api.jmerce.example/problems/conflict
        title: Resource state conflict
        status: 409
        detail: A customer profile already exists for this identity.
        instance: /customers
        code: CUSTOMER_ALREADY_EXISTS
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    InternalError:
      summary: Unexpected server failure
      value:
        type: https://api.jmerce.example/problems/internal-error
        title: Internal server error
        status: 500
        detail: An unexpected error occurred.
        instance: /customers/01985dd9-6d7d-7c76-a91b-4a175c3dbfc3
        code: INTERNAL_ERROR
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
