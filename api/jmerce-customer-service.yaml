openapi: 3.1.0

info:
  title: Customer Service API
  description: |
    Public REST API for managing customer business profiles and addresses.
  version: 0.1.0

servers:
  - url: http://localhost:8090
    description: Local Customer Service instance

tags:
  - name: Customers
    description: Customer business profile lifecycle.
  - name: Addresses
    description: Shipping and billing addresses owned by a customer.

paths:
  /customers:
    post:
      tags:
        - Customers
      summary: Create a customer profile
      description: |
        Creates a business profile for an identity that already exists in Keycloak.
        Only one customer profile can be associated with a `userId`.
      operationId: createCustomerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Customer profile created.
          headers:
            Location:
              description: URI of the created customer profile.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: './jmerce-problem.yaml#/components/responses/BadRequest'
        '409':
          $ref: './jmerce-problem.yaml#/components/responses/Conflict'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'

  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
        - Customers
      summary: Get a customer profile
      operationId: getCustomerProfile
      responses:
        '200':
          description: Customer profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'
    put:
      tags:
        - Customers
      summary: Replace editable customer profile data
      description: |
        Replaces the customer-managed profile fields. The Keycloak identity link and
        lifecycle status cannot be changed through this operation. Omitting the optional
        `phoneNumber` clears it.
      operationId: replaceCustomerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Customer profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: './jmerce-problem.yaml#/components/responses/BadRequest'
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '409':
          $ref: './jmerce-problem.yaml#/components/responses/Conflict'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'
    delete:
      tags:
        - Customers
      summary: Close a customer profile
      description: |
        Closes the customer business profile and its customer-facing lifecycle without
        deleting the Keycloak identity. Repeating the operation for an already closed
        profile is successful.
      operationId: closeCustomerProfile
      responses:
        '204':
          description: Customer profile closed; no response body is returned.
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'

  /customers/{customerId}/addresses:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
        - Addresses
      summary: List customer addresses
      operationId: listCustomerAddresses
      parameters:
        - $ref: '#/components/parameters/AddressPurposeFilter'
      responses:
        '200':
          description: Customer addresses returned. The array is empty when none exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'
    post:
      tags:
        - Addresses
      summary: Create a customer address
      description: |
        Creates a shipping or billing address. At most one address can be the default
        for each purpose. When `isDefault` is true, any existing default for the same
        purpose is replaced atomically.
      operationId: createCustomerAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          description: Customer address created.
          headers:
            Location:
              description: URI of the created customer address.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: './jmerce-problem.yaml#/components/responses/BadRequest'
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '409':
          $ref: './jmerce-problem.yaml#/components/responses/Conflict'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'

  /customers/{customerId}/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/AddressId'
    get:
      tags:
        - Addresses
      summary: Get a customer address
      operationId: getCustomerAddress
      responses:
        '200':
          description: Customer address found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'
    put:
      tags:
        - Addresses
      summary: Replace a customer address
      description: |
        Replaces the address data but does not change whether the address is the default.
        Use the dedicated default-address operation to change that assignment. Omitting
        an optional nullable field clears it.
      operationId: replaceCustomerAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateRequest'
      responses:
        '200':
          description: Customer address updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: './jmerce-problem.yaml#/components/responses/BadRequest'
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '409':
          $ref: './jmerce-problem.yaml#/components/responses/Conflict'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'
    delete:
      tags:
        - Addresses
      summary: Delete a customer address
      operationId: deleteCustomerAddress
      responses:
        '204':
          description: Customer address deleted; no response body is returned.
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '409':
          $ref: './jmerce-problem.yaml#/components/responses/Conflict'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'

  /customers/{customerId}/addresses/{addressId}/default:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/AddressId'
    put:
      tags:
        - Addresses
      summary: Set a customer address as the default
      description: |
        Makes this address the default for its purpose and atomically removes that flag
        from the previous default address of the same purpose. Repeating the operation
        for the current default address has no additional effect.
      operationId: setDefaultCustomerAddress
      responses:
        '200':
          description: Default address assignment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '404':
          $ref: './jmerce-problem.yaml#/components/responses/NotFound'
        '409':
          $ref: './jmerce-problem.yaml#/components/responses/Conflict'
        '500':
          $ref: './jmerce-problem.yaml#/components/responses/InternalServerError'

components:
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      description: Customer business profile identifier.
      schema:
        type: string
        format: uuid
        example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3
    AddressId:
      name: addressId
      in: path
      required: true
      description: Address identifier owned by the customer in the path.
      schema:
        type: string
        format: uuid
        example: 01985dda-369b-79ca-b943-3e0353f206d8
    AddressPurposeFilter:
      name: purpose
      in: query
      required: false
      description: Return only addresses with the requested purpose.
      schema:
        $ref: '#/components/schemas/AddressPurpose'

  schemas:
    CustomerCreateRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - givenName
        - familyName
      properties:
        userId:
          type: string
          format: uuid
          description: Immutable Keycloak subject identifier.
          example: 01985dd8-d6d7-758b-b778-3b20e2a618c9
        givenName:
          $ref: '#/components/schemas/GivenName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

    CustomerUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - givenName
        - familyName
      properties:
        givenName:
          $ref: '#/components/schemas/GivenName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

    CustomerResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - givenName
        - familyName
        - phoneNumber
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3
        userId:
          type: string
          format: uuid
          readOnly: true
          description: Immutable Keycloak subject identifier.
          example: 01985dd8-d6d7-758b-b778-3b20e2a618c9
        givenName:
          $ref: '#/components/schemas/GivenName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'
        status:
          allOf:
            - $ref: '#/components/schemas/CustomerStatus'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-09T15:30:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-09T15:30:00Z'

    AddressCreateRequest:
      type: object
      additionalProperties: false
      required:
        - purpose
        - recipientName
        - line1
        - city
        - countryCode
      properties:
        purpose:
          $ref: '#/components/schemas/AddressPurpose'
        recipientName:
          type: string
          minLength: 1
          maxLength: 200
          example: Ivan Ivanov
        line1:
          type: string
          minLength: 1
          maxLength: 300
          example: 15 Strict Avenue
        line2:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 300
          example: Apartment 42
        city:
          type: string
          minLength: 1
          maxLength: 150
          example: Minsk
        region:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 150
          example: Minsk
        postalCode:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
          example: '220030'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code in uppercase.
          example: BY
        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'
        isDefault:
          type: boolean
          default: false
          description: Whether to make this address the default for its purpose.

    AddressUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - purpose
        - recipientName
        - line1
        - city
        - countryCode
      properties:
        purpose:
          $ref: '#/components/schemas/AddressPurpose'
        recipientName:
          type: string
          minLength: 1
          maxLength: 200
          example: Ivan Ivanov
        line1:
          type: string
          minLength: 1
          maxLength: 300
          example: 15 Strict Avenue
        line2:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 300
          example: Apartment 42
        city:
          type: string
          minLength: 1
          maxLength: 150
          example: Minsk
        region:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 150
          example: Minsk
        postalCode:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
          example: '220030'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code in uppercase.
          example: BY
        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'

    AddressResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - customerId
        - purpose
        - recipientName
        - line1
        - line2
        - city
        - region
        - postalCode
        - countryCode
        - phoneNumber
        - isDefault
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 01985dda-369b-79ca-b943-3e0353f206d8
        customerId:
          type: string
          format: uuid
          readOnly: true
          example: 01985dd9-6d7d-7c76-a91b-4a175c3dbfc3
        purpose:
          $ref: '#/components/schemas/AddressPurpose'
        recipientName:
          type: string
          minLength: 1
          maxLength: 200
          example: Ivan Ivanov
        line1:
          type: string
          minLength: 1
          maxLength: 300
          example: 15 Strict Avenue
        line2:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 300
          example: Apartment 42
        city:
          type: string
          minLength: 1
          maxLength: 150
          example: Minsk
        region:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 150
          example: Minsk
        postalCode:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 32
          example: '220030'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code in uppercase.
          example: BY
        phoneNumber:
          $ref: '#/components/schemas/NullablePhoneNumber'
        isDefault:
          type: boolean
          readOnly: true
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-09T15:35:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-09T15:35:00Z'

    GivenName:
      type: string
      minLength: 1
      maxLength: 100
      example: Ivan

    FamilyName:
      type: string
      minLength: 1
      maxLength: 100
      example: Ivanov

    NullablePhoneNumber:
      type:
        - string
        - 'null'
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: Phone number in E.164 format, or null when not provided.
      example: '+375291234567'

    CustomerStatus:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - CLOSED
      description: Server-managed customer lifecycle status.
      example: ACTIVE

    AddressPurpose:
      type: string
      enum:
        - SHIPPING
        - BILLING
      example: SHIPPING
